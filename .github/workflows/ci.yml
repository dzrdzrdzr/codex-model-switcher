name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  node:
    name: JavaScript checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
  remote-helper:
    name: Linux disposable-home integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n scripts/remote-helper.sh
      - run: bash test/remote-helper.test.sh
      - run: python3 test/remote-edge-cases.py
  package:
    name: Check VSIX and website
    runs-on: ubuntu-latest
    needs: [node, remote-helper]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive checked source
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/checked-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: checked-source
          path: dist/checked-source.zip
          if-no-files-found: error
      - run: npm run build:site && npm run check:site
      - run: npm run package:list && npm run package:vsix
        env:
          BUILD_SOURCE_REF: ${{ inputs.ref || github.head_ref || github.sha }}
      - name: Verify packaged bytes and checksum
        shell: bash
        run: python3 scripts/verify-vsix.py dist/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: checked-vsix
          path: |
            dist/*.vsix
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site/
          if-no-files-found: error
