name: Prepare draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check tag against package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- --tag "$RELEASE_TAG"
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checked-vsix
          path: dist
      - name: Create a draft only; never overwrite a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.vsix dist/SHA256SUMS \
            --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
