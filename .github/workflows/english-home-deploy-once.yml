name: Publish English editorial homepage once
# One explicit website publication. Remove this trigger after checking the outcome.
on:
  push:
    branches: [main]
    paths: ['.github/english-home-deploy-20261015.json']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  website:
    if: ${{ github.repository == 'dzrdzrdzr/codex-model-switcher' && contains(github.event.head_commit.message, 'Publish English editorial homepage 2026-10-15') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate this one-time publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          request = json.loads(Path('.github/english-home-deploy-20261015.json').read_text())
          base = '57417edafc94df939200219e3b4328d98aaf9fbf'
          assert request['request_id'] == 'english-editorial-20261015'
          assert request['confirm_pages'] is True and request['base_sha'] == base
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          allowed = {'docs/home.en.html', 'scripts/build-site.js', 'test/editorial-home.test.js',
                     '.github/english-home-deploy-20261015.json', '.github/workflows/english-home-deploy-once.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          assert changed == allowed, changed
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run verify && npm run build:site && npm run check:site
      - run: python3 scripts/verify-live-discovery.py --prepare
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the approved English article
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Compare live pages with the built files without resubmitting URLs
        run: python3 scripts/verify-live-discovery.py --output dist/english-editorial-live.json
      - name: Preserve live verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: english-editorial-live-evidence
          path: dist/english-editorial-live.json
          if-no-files-found: warn
