name: Bug report
description: Report a reproducible switching, installation, or status problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the switcher. Remove API keys, tokens, usernames, hostnames, and private paths before posting logs.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local VS Code on Windows
        - VS Code Remote SSH on Linux
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Switcher version
      placeholder: 0.2.7
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: codex-cli 0.148.0
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Redacted status output
      description: Paste the Show Current Codex Source Status output only after checking that it contains no secrets or private host details.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens, usernames, hostnames, and private paths.
          required: true
